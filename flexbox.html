<!DOCTYPE html>
<html>
    <head>
        <title>flexbox</title>
        <style>
            
            .flex-container {
                display: flex;
                width: 200px;
                background-color: darkslateblue;
                padding: 20px;
            }

            .flex-container div {
             width: 200px;
             background-color: lightcoral;
             margin: 5px;
            padding: 5px; 
            }
        </style>
    </head>
    <body>

    <div class="flex-container">
        <div>what's the capital of france?</div>
        <div>what does the cow say?</div>
        <div>why's the fridge locked up so tight?</div>
    </div>

    </body>
</html>
